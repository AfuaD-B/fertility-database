<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fertility Explorer</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
<style>
#app-loader {position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; justify-content: center;  align-items: center; background: white; font-family: sans-serif;}
#app-loader-spinner {width: 42px;  height: 42px;  border: 4px solid #e0e0e0; border-top-color: #666666;  border-radius: 50%; animation: loader-spin 0.8s linear infinite; margin-bottom: 16px;}
#app-loader-message {font-size: 18px;  color: #444;}
#app-loader-submessage { margin-top: 6px; font-size: 13px;  color: #777;}
@keyframes loader-spin {  to { transform: rotate(360deg); }}
</style>

  </head>
  <body>
    
<div id="app-loader">
<div id="app-loader-spinner"></div>
<div id="app-loader-message">
Fertility database loading...
</div>
<div id="app-loader-submessage">
The database may take a while to load on first visit.
</div>
</div>

    <div style="height: 100vh; width: 100vw" id="root"></div>
    
<script>

(function waitForShiny() {

  if (window.jQuery) {

    window.jQuery(document).one("shiny:connected", function() {

      const loader = document.getElementById("app-loader");

      if (loader) {
        loader.style.transition = "opacity 0.3s ease";
        loader.style.opacity = "0";

        setTimeout(function() {
          loader.remove();
        }, 300);
      }

    });

  } else {
    setTimeout(waitForShiny, 100);
  }

})();

// Update message if startup is slower than usual
setTimeout(function() {

  const msg = document.getElementById("app-loader-submessage");

  if (msg) {
    msg.textContent =
      "Still loading — the first visit can take a little longer.";
  }

}, 8000);

// Safety fallback: never leave the overlay forever
setTimeout(function() {

  const loader = document.getElementById("app-loader");

  if (loader) {
    loader.style.transition = "opacity 0.3s ease";
    loader.style.opacity = "0";

    setTimeout(function() {
      loader.remove();
    }, 300);
  }

}, 20000);

</script>

  </body>
</html>
