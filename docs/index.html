<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fertility Explorer</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
<style>

#app-loader {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Arial, sans-serif;
}

#app-loader-content {
  text-align: center;
  max-width: 500px;
  padding: 30px;
}

#app-loader-spinner {
  width: 45px;
  height: 45px;
  margin: 0 auto 20px auto;

  border: 5px solid #e5e5e5;
  border-top: 5px solid #333333;
  border-radius: 50%;

  animation: app-loader-spin 1s linear infinite;
}

#app-loader-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 10px;
}

#app-loader-submessage {
  font-size: 15px;
  color: #666666;
}

@keyframes app-loader-spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

</style>

  </head>
  <body>
    
<div id="app-loader">

  <div id="app-loader-content">

    <div id="app-loader-spinner"></div>

    <div id="app-loader-title">
      Loading Fertility Explorer
    </div>

    <div id="app-loader-submessage">
      Preparing the data and application...
    </div>

  </div>

</div>

    <div style="height: 100vh; width: 100vw" id="root"></div>
    
<script>

(function waitForShiny() {

  if (window.jQuery) {

    window.jQuery(document).one("shiny:connected", function() {

      const loader = document.getElementById("app-loader");

      if (loader) {

        loader.style.transition = "opacity 0.3s ease";
        loader.style.opacity = "0";

        setTimeout(function() {
          loader.remove();
        }, 300);

      }

    });

  } else {

    setTimeout(waitForShiny, 100);

  }

})();


// Update message if startup is slower than usual

setTimeout(function() {

  const msg =
    document.getElementById("app-loader-submessage");

  if (msg) {

    msg.textContent =
      "Still loading — the first visit can take a little longer.";

  }

}, 8000);


// Safety fallback: never leave the overlay forever

setTimeout(function() {

  const loader =
    document.getElementById("app-loader");

  if (loader) {

    loader.style.transition = "opacity 0.3s ease";
    loader.style.opacity = "0";

    setTimeout(function() {
      loader.remove();
    }, 300);

  }

}, 20000);

</script>

  </body>
</html>
